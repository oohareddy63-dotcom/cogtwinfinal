services:
  # ─── Backend Web Service ───────────────────────────────────────────────────
  - type: web
    name: digital-cognitive-twin
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_EXPIRES_IN
        value: 7d
      # Set these as secrets in Render Dashboard → Environment:
      # MONGODB_URI      — your MongoDB Atlas connection string
      # JWT_SECRET       — any long random string
      # GEMINI_API_KEY   — for AI chat, insights, recommendations
      # GROQ_API_KEY     — for test question generation
      # FRONTEND_URL     — https://digital-cognitive-twin-1.onrender.com

  # ─── Frontend Static Site ──────────────────────────────────────────────────
  - type: web
    name: digital-cognitive-twin-1
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://digital-cognitive-twin.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
